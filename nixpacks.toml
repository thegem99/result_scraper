[phases.setup]
nixPkgs = [
  "python311",
  "glib",
  "nss",
  "nspr",
  "atk",
  "cups",
  "dbus",
  "expat",
  "fontconfig",
  "libdrm",
  "libxcomposite",
  "libxdamage",
  "libxrandr",
  "libgbm",
  "libxkbcommon",
  "pango",
  "cairo"
]

[phases.build]
cmds = [
  "pip install -r requirements.txt",
  "playwright install chromium"
]

[start]
cmd = "python bot.py"
